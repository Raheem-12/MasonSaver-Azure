<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | MasonSaver</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #174f2d;
      background: linear-gradient(135deg, #f7f5ed, #eef4ed);
    }

    main {
      width: min(620px, 100%);
      padding: 54px 32px;
      border-radius: 24px;
      text-align: center;
      background: white;
      box-shadow: 0 24px 60px rgba(23, 79, 45, 0.15);
    }

    .error-code {
      margin: 0;
      color: #d89a27;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 6rem;
      line-height: 1;
    }

    h1 {
      margin: 18px 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.3rem;
    }

    p {
      margin-bottom: 28px;
      color: #657168;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      color: white;
      background: #1f5a36;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      background: #174727;
    }
  </style>
</head>

<body>
  <main>
    <p class="error-code">404</p>
    <h1>Page not found</h1>
    <p>
      The page you requested does not exist or may have been moved.
    </p>
    <a href="index.html">Return to MasonSaver</a>
  </main>
</body>
</html>
